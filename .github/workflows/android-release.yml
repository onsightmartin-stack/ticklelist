name: Build Android App Bundle (AAB)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (must increase every upload, e.g. 1, 2, 3...)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to users (e.g. 1.0)"
        required: true
        default: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node/Bun (for web build)
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build web app
        run: bun run build

      - name: Sync Capacitor
        run: |
          mkdir -p android/app/src/main/assets
          bunx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ticklelist-release.keystore

      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version_code }}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ inputs.version_name }}"/' android/app/build.gradle

      - name: Build signed AAB
        working-directory: android
        env:
          KSTORE_PW: ${{ secrets.KSTORE_PW }}
          KEY_PW: ${{ secrets.KEY_PW }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
